<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komodoro</title>
<style>
  :root { --bg:#14110f; --fg:#e9e2cb; --dim:#8a8273; --accent:#c98a5e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:Georgia,'Fraunces',serif; min-height:100vh;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem; padding:2rem; }
  h1 { font-weight:400; letter-spacing:.04em; margin:0; font-size:2.4rem; }
  .sub { color:var(--dim); margin:-1rem 0 0; font-style:italic; }
  button { font-family:inherit; font-size:1rem; background:none; color:var(--fg);
           border:1px solid var(--dim); border-radius:2px; padding:.7rem 1.4rem; cursor:pointer;
           transition:.15s; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.35; cursor:default; }
  .durations { display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; }
  #status { color:var(--dim); min-height:1.2em; text-align:center; max-width:30rem; }
  #now { font-size:1.3rem; text-align:center; min-height:1.5em; }
  #now small { display:block; color:var(--dim); font-size:.8rem; margin-top:.3rem; }
  #timer { font-size: 2.5rem; font-weight: bold; text-align: center; margin-top: 1rem; min-height: 1.2em; }
  input { font-family:inherit; font-size:1rem; width:5rem; background:none; color:var(--fg);
          border:1px solid var(--dim); border-radius:2px; padding:.7rem; text-align:center; }
  .hidden { display:none !important; }
  a { color:var(--accent); }
  details { margin-top: 1rem; border: 1px solid var(--dim); border-radius: 2px; padding: .5rem 1rem; }
  summary { cursor: pointer; }
  ol { list-style: decimal inside; padding: 0; margin: .5rem 0 0; }
  ol li { padding: .2rem 0; border-bottom: 1px dotted var(--dim); }
  ol li:last-child { border-bottom: none; }
  ol li small { display:block; color:var(--dim); font-size:.8rem; }
  ol li.playing { color: var(--accent); }
  ol li.passed, ol li.passed small { color: var(--dim); opacity:.55; }
</style>
</head>
<body>
  <h1>Komodoro</h1>
  <p class="sub">tystnad = klar</p>

  <div id="login-view">
    <button id="login">Logga in med Spotify</button>
  </div>

  <div id="app-view" class="hidden">
    <div class="durations">
      <button class="dur" data-min="25">25 min arbete</button>
      <input id="custom" type="number" min="1" max="180" placeholder="min">
      <button class="dur" data-custom>Starta</button>
      <label for="pausmin">Paus:</label>
      <input id="pausmin" type="number" value="5" min="1" max="60"> min
    </div>
    <div id="now"></div>
    <div id="timer"></div>
    <details><summary>Visa låtar</summary><ol id="tracklist"></ol></details>
    <button id="stop" class="hidden">Stoppa</button>
    <p><a href="#" id="relogin">logga in igen (ny token / nya scopes)</a></p>
  </div>

  <p id="status"></p>

<script>
// ── Spotify-app (registrerad) ──────────────────────────────────────────────
const CLIENT_ID = "146c72f11c944dd0a26999ffea7ef350";
const REDIRECT_URI = location.origin + "/callback";
// streaming + de två SDK-obligatoriska read-scopes + library
const SCOPES = "user-library-read streaming user-read-email user-read-private";

const $ = s => document.querySelector(s);
const status = m => { $("#status").textContent = m; };

// ── PKCE-login ─────────────────────────────────────────────────────────────
async function sha256b64url(v){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function randStr(n){
  return [...crypto.getRandomValues(new Uint8Array(n))]
    .map(b => "0123456789abcdefghijklmnopqrstuvwxyz"[b%36]).join("");
}
async function login(){
  const verifier = randStr(64);
  localStorage.setItem("kmd_verifier", verifier);
  const challenge = await sha256b64url(verifier);
  const p = new URLSearchParams({
    client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT_URI,
    scope: SCOPES, code_challenge_method: "S256", code_challenge: challenge });
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
$("#login").onclick = login;
document.addEventListener("click", e => {
  if (e.target.id === "relogin"){ e.preventDefault(); localStorage.removeItem("kmd_token"); login(); }
});

// ── Pass-uppbyggnad: shuffla ospelade, greedy-plock tills summan ≥ mål ───────
// Sista låten får gå över — exakt längd = summan av valda spår. Sessions-unik.
function buildPass(tracks, played, targetMin){
  const target = targetMin * 60000;
  const pool = tracks.filter(t => !played.has(t.uri));
  for (let i = pool.length - 1; i > 0; i--){           // Fisher–Yates
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const pick = []; let sum = 0;
  for (const t of pool){
    if (sum >= target) break;
    pick.push(t); sum += t.duration_ms;
  }
  return { pick, sum };
}

// ── Självtest (öppna ?selftest) ──────────────────────────────────────────────
function selftest(){
  const T = n => ({ uri:"u"+n, duration_ms:n*60000 });
  const tracks = [T(3),T(4),T(2),T(5),T(3)];
  const { pick, sum } = buildPass(tracks, new Set(), 8);
  console.assert(sum >= 8*60000, "summan ska nå/överskrida målet");
  console.assert(sum - pick[pick.length-1].duration_ms < 8*60000, "utan sista låten ska den vara under målet");
  const played = new Set(["u3"]);                      // markera en som spelad
  const r2 = buildPass([T(3)], played, 5);
  console.assert(r2.pick.length === 0, "spelade låtar plockas aldrig igen");
  status("selftest OK — se konsolen");
  console.log("selftest OK");
}

// ── Spotify Web Playback (kräver Premium) ────────────────────────────────────
let token, deviceId, player;
const allTracks = [];           // {uri, duration_ms, name}
const played = new Set();
let running = false; // Indicates if a work pass or break is active
let currentPhase = 'idle'; // 'work', 'break', 'idle'
let timerInterval = null;
let endTime = 0; // Timestamp when current phase ends
let lastWorkDurationMin = 0; // To restart work after break
let brownNoiseTrackUri = null;
let currentPick = [];           // uri-ordning för passets låtlista (highlight/gråning)

const fmtMs = ms => `${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,"0")}`;

async function api(path){
  const r = await fetch("https://api.spotify.com/v1" + path,
    { headers: { Authorization: "Bearer " + token } });
  if (!r.ok){ const b = await r.text(); throw new Error(`API ${r.status}: ${b.slice(0,200)}`); }
  return r.json();
}
// Visar fel, loggar INTE ut automatiskt (så meddelandet står kvar att läsa).
function fail(msg){ status("⚠ " + msg); console.error("[komodoro]", msg); }

async function loadLikedSongs(){
  status("Hämtar gillade låtar…");
  try {
    let url = "/me/tracks?limit=50";
    while (url){
      const j = await api(url);
      for (const it of j.items)
        allTracks.push({ uri: it.track.uri, duration_ms: it.track.duration_ms, name: it.track.name,
                         artist: it.track.artists.map(a => a.name).join(", "),
                         album: it.track.album.name });
      url = j.next ? j.next.replace("https://api.spotify.com/v1","") : null;
    }
    status(`${allTracks.length} låtar redo. Välj passlängd.`);
  } catch(e){ fail(e.message); }
}

function updateTimer(){
  const remainingMs = endTime - Date.now();
  if (remainingMs <= 0) {
    clearInterval(timerInterval);
    $("#timer").textContent = "00:00";
    // ponytail: väggklocka, driftar vid manuell paus — arbete→paus ägs av
    // tystnadsdetekteringen i player_state_changed; klockan är bara display där.
    if (currentPhase === 'break') {
      startPass(lastWorkDurationMin); // Auto-restart work
    }
    return;
  }

  const totalSeconds = Math.floor(remainingMs / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;

  const formattedMinutes = String(minutes).padStart(2, '0');
  const formattedSeconds = String(seconds).padStart(2, '0');

  $("#timer").textContent = `${formattedMinutes}:${formattedSeconds}`;
}

async function startPass(min){
  if (!deviceId){ status("Spelaren är inte redo än."); return; }
  if (timerInterval) clearInterval(timerInterval); // Clear any existing timer

  const { pick, sum } = buildPass(allTracks, played, min);
  if (!pick.length){ status("Inga osedda låtar kvar — alla har spelats denna session."); return; }
  
  pick.forEach(t => played.add(t.uri));
  lastWorkDurationMin = min; // Store for auto-restart
  running = true;
  currentPhase = 'work';
  $("#stop").classList.remove("hidden");
  status(`Pass: ${pick.length} låtar, ~${Math.round(sum/60000)} min.`);
  
  // Update tracklist
  currentPick = pick.map(t => t.uri);
  const tracklistEl = $("#tracklist");
  tracklistEl.innerHTML = '';
  pick.forEach(t => {
    const li = document.createElement('li');
    li.textContent = `${t.artist} — ${t.name}`;   // textContent — låtnamn är otrodd input
    const small = document.createElement('small');
    small.textContent = `${t.album} · ${fmtMs(t.duration_ms)}`;
    li.appendChild(small);
    tracklistEl.appendChild(li);
  });
  $("#tracklist").closest('details').open = true; // Open details by default

  await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
    method:"PUT", headers:{ Authorization:"Bearer "+token, "Content-Type":"application/json" },
    body: JSON.stringify({ uris: pick.map(t => t.uri) }) });
  
  endTime = Date.now() + sum;
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer(); // Initial call to display immediately
}

async function startBreak(){
  if (!deviceId){ status("Spelaren är inte redo än."); return; }
  if (timerInterval) clearInterval(timerInterval); // Clear any existing timer

  const breakMin = parseInt($("#pausmin").value, 10) || 5;

  running = true;
  currentPhase = 'break';
  $("#stop").classList.remove("hidden");
  $("#now").textContent = "Paus!";
  $("#tracklist").innerHTML = ''; // Clear tracklist for break
  $("#tracklist").closest('details').open = false; // Close details for break

  status(`Paus: ${breakMin} minuter.`);

  if (!brownNoiseTrackUri) {
    try {
      const searchResult = await api(`/search?q=brown%20noise&type=track&limit=10`);
      const items = searchResult.tracks.items;
      // Helst ett spår som täcker pausen, annars det längsta — tyst svans är ok.
      const suitableTrack = items.find(t => t.duration_ms >= breakMin * 60000) ||
        items.slice().sort((a,b) => b.duration_ms - a.duration_ms)[0];
      if (suitableTrack) brownNoiseTrackUri = suitableTrack.uri;
    } catch (e) {
      console.warn("[komodoro] brusspår misslyckades, tyst paus:", e.message);
    }
  }

  if (brownNoiseTrackUri){
    await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
      method:"PUT", headers:{ Authorization:"Bearer "+token, "Content-Type":"application/json" },
      body: JSON.stringify({ uris: [brownNoiseTrackUri] }) });
  }

  endTime = Date.now() + (breakMin * 60000);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer(); // Initial call to display immediately
}

function stopCycle(){
  running = false;
  if (player) player.pause();
  if (timerInterval) clearInterval(timerInterval);
  $("#now").textContent = "";
  $("#timer").textContent = "";
  $("#tracklist").innerHTML = '';
  $("#tracklist").closest('details').open = false;
  $("#stop").classList.add("hidden");
  status("Stoppat.");
  currentPhase = 'idle';
}

function initPlayer(){
  player = new Spotify.Player({ name:"Komodoro", getOAuthToken: cb => cb(token), volume:0.7 });
  player.addListener("ready", ({ device_id }) => { deviceId = device_id; loadLikedSongs(); });
  player.addListener("not_ready", () => status("Spelaren tappade anslutningen."));
  player.addListener("initialization_error", ({message}) => fail("SDK-init: " + message));
  player.addListener("authentication_error", ({message}) => fail("SDK auth: " + message + " (oftast saknad scope eller utgången token — klicka login igen)"));
  player.addListener("account_error", () => fail("Spotify Premium krävs för uppspelning (kontot är inte Premium)."));
  // Tystnad = klar: sista spåret slut, inget nästa, paus vid position 0.
  player.addListener("player_state_changed", st => {
    if (!st || !running) return;
    
    if (currentPhase === 'work') {
        $("#now").innerHTML = `▸ ${st.track_window.current_track.name}` +
        `<small>${st.track_window.next_tracks.length} låtar kvar i passet</small>`;
        // Markera spelande låt, gråa passerade (uri-match; relinkade spår matchar ej → ingen markering)
        const idx = currentPick.indexOf(st.track_window.current_track.uri);
        [...$("#tracklist").children].forEach((li, i) => {
          li.classList.toggle("playing", i === idx);
          li.classList.toggle("passed", idx >= 0 && i < idx);
        });
        if (st.paused && st.position === 0 && st.track_window.next_tracks.length === 0){
            // Work pass finished, start break
            startBreak();
        }
    } else if (currentPhase === 'break') {
        $("#now").innerHTML = `▸ Paus: ${st.track_window.current_track.name}`;
        // If brown noise track ends, the timer will handle the transition to next work pass
    }
  });
  player.connect();
}

document.querySelectorAll(".dur").forEach(b => b.onclick = () => {
  const min = b.dataset.custom !== undefined ? parseInt($("#custom").value,10) : parseInt(b.dataset.min,10);
  if (min > 0) startPass(min);
});
$("#stop").onclick = stopCycle;

// ── Boot ─────────────────────────────────────────────────────────────────────
if (location.search.includes("selftest")){ selftest(); }
else {
  token = localStorage.getItem("kmd_token");
  if (token){
    $("#login-view").classList.add("hidden");
    $("#app-view").classList.remove("hidden");
    const s = document.createElement("script");
    s.src = "https://sdk.scdn.co/spotify-player.js";
    document.head.appendChild(s);
    window.onSpotifyWebPlaybackSDKReady = initPlayer;
    status("Ansluter spelaren…");
  }
}
</script>
</body>
</html>
