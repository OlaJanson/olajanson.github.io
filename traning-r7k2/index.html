<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Träning</title>
<style>
  /* Sajtens typsnitt och palett, se quartz/styles/custom.scss och quartz.config.yaml. */
  @font-face { font-family: 'Magic Romance'; src: url('/fonts/magic-romance.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'Fraunces'; src: url('/fonts/fraunces.ttf') format('truetype'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'SKF Sans'; src: url('/fonts/skfsans.otf') format('opentype'); font-display: swap; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         user-select: none; background: #14120e; color: #EAE6DA; font-family: 'Fraunces', Georgia, serif;
         background-image:
           radial-gradient(at 15% 10%, color-mix(in oklab, #3a2010 60%, transparent) 0px, transparent 45%),
           radial-gradient(at 85% 65%, color-mix(in oklab, #2a1a08 55%, transparent) 0px, transparent 50%),
           radial-gradient(at 45% 85%, color-mix(in oklab, #1a2a20 40%, transparent) 0px, transparent 50%),
           radial-gradient(at 55% 30%, color-mix(in oklab, #0a1018 35%, transparent) 0px, transparent 55%);
         background-attachment: fixed; }
  button { font-family: 'SKF Sans', sans-serif; font-size: 1.4rem; padding: .7em 1.3em; margin: .4em; cursor: pointer;
           background: #1e1610; color: #EAE6DA; border: 1px solid #2a2a2a; border-radius: .4em; }
  button:hover { color: #fff; border-color: #9E9A91; }
  h1 { font-family: 'Magic Romance', serif; font-weight: normal; color: #F2D024; font-size: clamp(2.6rem, 9vw, 4.2rem); margin: 0 0 .4em; }
  #val { text-align: center; }
  #val label { display: block; margin-top: 1.2em; font-family: 'SKF Sans', sans-serif; color: #9E9A91; font-size: 1.1rem; }
  #pass { display: none; text-align: center; width: 100%; max-width: 900px; }
  #steg, #rad, #tips { font-family: 'SKF Sans', sans-serif; color: #9E9A91; font-size: 1.1rem; }
  #namn { font-family: 'Magic Romance', serif; color: #F2D024; font-size: clamp(1.9rem, 7vw, 3.6rem); line-height: 1.1; overflow-wrap: break-word; margin: .2em .3em; }
  #bild { max-height: 34vh; max-width: 92%; border-radius: .3em; }
  #bild:not([src]) { display: none; }
  #antal { font-weight: 300; font-size: clamp(5rem, 25vw, 9rem); line-height: 1; margin-top: .2em; }
  #antal small { font-size: .45em; color: #666; }
  #prickar { font-size: 2rem; letter-spacing: .15em; color: #2a2a2a; }
  #prickar b { color: #b5e8e7; font-weight: normal; }
  #tips { color: #666; margin-top: .8em; }
  #kalender { display: grid; grid-template-columns: repeat(7, 1fr); gap: .3rem; width: min(92vw, 30rem); margin: 0 auto 1.5em; font-family: 'SKF Sans', sans-serif; }
  #kalender div { background: #1e1610; border-radius: .3em; padding: .3em .4em; color: #9E9A91; font-size: .9rem; text-align: left; }
  #kalender .rubrik { background: none; text-align: center; color: #666; }
  #kalender .idag { outline: 1px solid #9E9A91; color: #EAE6DA; }
  #kalender span { display: block; text-align: right; letter-spacing: .15em; color: #3a3226; font-size: .75rem; }
  #kalender span b { color: #b5e8e7; font-weight: normal; }
</style>
</head>
<body>
<div id="val">
  <h1>Träning</h1>
  <div id="kalender"></div>
  <button data-pass="sang">Säng (övning 1–3)</button>
  <button data-pass="bord">Stående (övning 4–8)</button>
  <label><input type="checkbox" id="test"> Bara testa, räknas inte</label>
</div>
<div id="pass">
  <div id="steg"></div>
  <div id="namn"></div>
  <div id="rad"></div>
  <img id="bild" alt="">
  <div id="antal"></div>
  <div id="prickar"></div>
  <div id="kontroll"><button id="tillbaka">Tillbaka</button><button id="hoppa">Hoppa över</button></div>
  <div id="tips">Tryck var som helst eller mellanslag = en repetition · Backsteg = ångra</div>
</div>
<script>
// Programmet ur SÄS-broschyren sid 13–14: namn, instruktion (läses upp), antal, bild 1–8 = broschyrens övningsnummer.
// Rösten är förinspelad i ljud/<pass>-<index>.mp3 (Ernst-Hugo-klonen) och läser hela övningen.
const OVNINGAR = {
  sang: [
    ['Släpcykling', 'Ligg på rygg. Böj knät och dra foten mot dig, foten kvar i underlaget.', 20, 1],
    ['Släpcykling, håll', 'Håll kvar i det böjda läget några sekunder.', 5, 1],
    ['Spänn framsida lår', 'Sträck knät, pressa knävecket mot underlaget. Släpp.', 20, 2],
    ['Spänn lår, håll', 'Spänn framsida lår maximalt några sekunder.', 5, 2],
    ['Bäckenlyft', 'Böjda knän. Spänn sätet, lyft bäckenet, håll, sänk långsamt. Upp till tjugo om det går.', 10, 3],
  ],
  bord: [
    ['Tyngdöverföring', 'Stöd mot bordet. Flytta vikten från ena foten till den andra. Höfterna raka.', 10, 4],
    ['Tåhävning', 'Stöd mot bordet. Upp och ner på tå, lika mycket vikt på båda fötterna.', 10, 5],
    ['Små knäböj', 'Stöd mot bordet. Små knäböj, lika mycket vikt på båda fötterna.', 10, 6],
    ['Liten spark bakåt', 'Stå på det friska benet, stöd mot bordet. Spänn skinkan, för det opererade benet bakåt. Överkroppen stilla.', 10, 7],
    ['Liten spark åt sidan', 'Stå på det friska benet, stöd mot bordet. Liten spark åt sidan, led med hälen. Överkroppen stilla.', 10, 8],
  ],
};
const $ = id => document.getElementById(id);
let pass = '', lista = [], i = 0, n = 0, test = false;

// Dagar i rad per övning, sparat i webbläsaren: { namn: [senaste datum, antal] }.
// Mobilen och datorn har var sin räkning; säng görs i mobilen och stående vid datorn.
const dag = (forskjut = 0) => { const d = new Date(); d.setDate(d.getDate() + forskjut); return d.toLocaleDateString('sv-SE'); };
const rader = JSON.parse(localStorage.getItem('traning-rad') || '{}');
const iRad = ([datum, antal] = []) => datum === dag() || datum === dag(-1) ? antal : 0;
const klar = ([datum, antal] = []) => datum === dag() ? [datum, antal] : [dag(), datum === dag(-1) ? antal + 1 : 1];

// Avslutade pass per dag, sparat i webbläsaren: ['2026-10-10', ...]. Månadskalendern tänder en prick per pass, max tre.
const passlogg = JSON.parse(localStorage.getItem('traning-pass') || '[]');
function kalender() {
  const nu = new Date(), ar = nu.getFullYear(), m = nu.getMonth(), dagar = new Date(ar, m + 1, 0).getDate();
  let h = ['må','ti','on','to','fr','lö','sö'].map(d => `<div class="rubrik">${d}</div>`).join('');
  h += '<div class="rubrik"></div>'.repeat((new Date(ar, m, 1).getDay() + 6) % 7);
  for (let d = 1; d <= dagar; d++) {
    const k = Math.min(3, passlogg.filter(x => x === new Date(ar, m, d).toLocaleDateString('sv-SE')).length);
    h += `<div class="${d === nu.getDate() ? 'idag' : ''}">${d}<span><b>${'●'.repeat(k)}</b>${'●'.repeat(3 - k)}</span></div>`;
  }
  $('kalender').innerHTML = h;
}
kalender();

let ljud = null;
const spela = k => {
  if (ljud) ljud.pause();
  ljud = new Audio(k < lista.length ? `ljud/${pass}-${k}.mp3` : 'ljud/slut.mp3'); ljud.play().catch(() => {});
};

const ctx = new AudioContext();
const klick = (f = 660) => {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = f; g.gain.setValueAtTime(.15, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .12);
  o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .12);
};

function visa() {
  $('hoppa').style.display = i < lista.length ? '' : 'none';
  if (i >= lista.length) {
    ['steg', 'rad', 'antal', 'prickar'].forEach(k => $(k).textContent = '');
    $('namn').textContent = 'Passet är slut'; $('bild').removeAttribute('src'); return;
  }
  const [namn, , mal, bild] = lista[i];
  $('steg').textContent = `${i + 1} av ${lista.length}` + (test ? ' · test, räknas inte' : '');
  $('namn').textContent = namn;
  const r = iRad(rader[namn]);
  $('rad').textContent = r ? `${r} ${r === 1 ? 'dag' : 'dagar'} i rad` : '';
  $('bild').src = `bilder/${bild}.jpg`;
  $('antal').innerHTML = `${n}<small> / ${mal}</small>`;
  $('prickar').innerHTML = '<b>' + '●'.repeat(n) + '</b>' + '●'.repeat(mal - n);
}

function ga(till) {
  if (till < 0) { if (ljud) ljud.pause(); lista = []; $('pass').style.display = 'none'; $('val').style.display = ''; return; }
  i = till; n = 0; visa(); spela(i);
  if (i === lista.length && !test) { passlogg.push(dag()); localStorage.setItem('traning-pass', JSON.stringify(passlogg)); kalender(); }
}

function rep(d) {
  if (i >= lista.length) return;
  n = Math.max(0, n + d); if (d > 0) klick();
  if (n >= lista[i][2]) {
    if (!test) { rader[lista[i][0]] = klar(rader[lista[i][0]]); localStorage.setItem('traning-rad', JSON.stringify(rader)); }
    klick(880); ga(i + 1);
  } else visa();
}

document.querySelectorAll('#val button').forEach(b => b.onclick = e => {
  e.stopPropagation(); ctx.resume();
  pass = b.dataset.pass; lista = OVNINGAR[pass]; test = $('test').checked;
  $('val').style.display = 'none'; $('pass').style.display = 'block';
  ga(0);
});
$('hoppa').onclick = e => { e.stopPropagation(); ga(i + 1); };
$('tillbaka').onclick = e => { e.stopPropagation(); ga(i - 1); };
document.body.addEventListener('click', () => lista.length && rep(1));
document.addEventListener('keydown', e => {
  if (!lista.length) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); rep(1); }
  if (e.key === 'Backspace') { e.preventDefault(); rep(-1); }
});
</script>
</body>
</html>
